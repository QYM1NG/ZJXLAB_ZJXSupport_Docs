<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>熙总应援站</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Docsify 主题 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/vue.css">
  
  <!-- 标签页图标 -->
  <link rel="icon" type="image/x-icon" href="/ZJXLAB_ZJXSupport_Docs/zjx-weblogo.ico">

  <style>
    /* ========== 封面按钮样式 ========== */
    .cover-btn {
      display: inline-block;
      padding: 10px 28px;
      margin: 10px 6px;
      border: 2px solid #ff69b4;
      border-radius: 30px;
      color: #ff69b4;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .cover-btn:hover {
      background-color: #ff69b4;
      color: white;
    }

    /* ========== 自定义光标 ========== */
    body {
      cursor: url('/ZJXLAB_ZJXSupport_Docs/kayoko-pointer-32.cur') 8 4, auto;
    }
    a, .cover-btn {
      cursor: url('/ZJXLAB_ZJXSupport_Docs/kayoko-pointer-32.cur') 8 4, pointer;
    }

    /* ========== 封面背景（备用，可能被内联样式覆盖） ========== */
    .cover {
      background: url('/ZJXLAB_ZJXSupport_Docs/docspic/zjxwelcome-background.png') center/cover no-repeat !important;
      color: white;
    }
  </style>
</head>
<body>
  <div id="app">加载中...</div>

  <!-- Docsify 配置 -->
  <script>
    window.$docsify = {
      name: '熙总应援站',
      coverpage: true,
      repo: 'https://github.com/QYM1NG/ZJXLAB_ZJXSupport_Docs',
      basePath: '/ZJXLAB_ZJXSupport_Docs/',
      loadSidebar: true,
      subMaxLevel: 3,
      // relativePath 默认 false（不写），所有资源用绝对路径
      search: {
        placeholder: '搜索文档',
        noData: '没有找到结果',
        paths: 'auto'
      }
    }
  </script>

  <!-- Docsify 核心库与搜索插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

  <!-- 强制替换封面背景（覆盖 Docsify 默认渐变） -->
  <script>
    (function() {
      var observer = new MutationObserver(function(mutations) {
        var cover = document.querySelector('.cover');
        if (cover && cover.style.background.indexOf('linear-gradient') !== -1) {
          cover.style.background = "url('/ZJXLAB_ZJXSupport_Docs/docspic/zjxwelcome-background.png') center/cover no-repeat";
          cover.style.color = 'white';
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>
</body>
</html>
