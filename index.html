<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>熙总应援站</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/vue.css">
  <!-- 网站图标（绝对路径） -->
  <link rel="icon" type="image/x-icon" href="/ZJXLAB_ZJXSupport_Docs/zjx-weblogo.ico">
  <style>
    .cover-btn {
      display: inline-block;
      padding: 10px 28px;
      margin: 10px 6px;
      border: 2px solid #ff69b4;
      border-radius: 30px;
      color: #ff69b4;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .cover-btn:hover {
      background-color: #ff69b4;
      color: white;
    }
    /* 光标（绝对路径） */
    body {
      cursor: url('/ZJXLAB_ZJXSupport_Docs/kayoko-pointer-32.cur') 8 4, auto;
    }
    a, .cover-btn {
      cursor: url('/ZJXLAB_ZJXSupport_Docs/kayoko-pointer-32.cur') 8 4, pointer;
    }
    /* ========== 封面背景图 ========== */
.cover {
  background: url('/ZJXLAB_ZJXSupport_Docs/docspic/zjxwelcome-background.png') center/cover no-repeat;
  color: white; /* 如果背景较深，文字设白；如果背景较浅，可改为 #333 等深色 */
}

/* 可选：给文字区域加半透明遮罩，提高可读性（根据实际背景决定是否开启） */
.cover .cover-main {
  background: rgba(0, 0, 0, 0.4); /* 0.4 是透明度，可自己调 */
  padding: 20px;
  border-radius: 12px;
}
  </style>
</head>
<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: '熙总应援站',
      coverpage: true,
      repo: 'https://github.com/QYM1NG/ZJXLAB_ZJXSupport_Docs',
      basePath: '/ZJXLAB_ZJXSupport_Docs/',
      loadSidebar: true,
      subMaxLevel: 3,
      // relativePath 不写，默认 false（关闭）
      search: {
        placeholder: '搜索文档',
        noData: '没有找到结果',
        paths: 'auto'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
