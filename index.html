<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>ZJX Support Docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/vue.css">
  <!-- 网站图标 -->
  <link rel="icon" type="image/x-icon" href="./zjx-webico.ico">
</head>
  <style>
  .cover-btn {
    display: inline-block;
    padding: 10px 28px;
    margin: 10px 6px;
    border: 2px solid #42b983;   /* 边框颜色，可换成你喜欢的 */
    border-radius: 30px;
    color: #42b983;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .cover-btn:hover {
    background-color: #42b983;
    color: white;
  }
</style>
<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: 'ZJX Support Docs',
      coverpage: true,
      repo: 'https://github.com/QYM1NG/ZJXLAB_ZJXSupport_Docs',
      basePath: '/ZJXLAB_ZJXSupport_Docs/',  // 重要！匹配你的仓库名
      loadSidebar: true,       // 启用 _sidebar.md
      subMaxLevel: 3,
      search: {
        placeholder: '搜索文档',
        noData: '没有找到结果',
        paths: 'auto'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
